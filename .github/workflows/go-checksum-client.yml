name: Native Go checksum client controls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/test_go_checksum_client.py', 'scripts/test_go_checksum_client_report.py', 'scripts/bounded_client.py', 'scripts/ci_native_diagnostics.py', 'scripts/oci_client_contract.py', 'internal/server/testdata/go-checksum-public.json', 'docs/qualification/ci-diagnostics-recipient.pem', 'go.mod', '.github/workflows/go-checksum-client.yml']
  pull_request:
    paths: ['scripts/test_go_checksum_client.py', 'scripts/test_go_checksum_client_report.py', 'scripts/bounded_client.py', 'scripts/ci_native_diagnostics.py', 'scripts/oci_client_contract.py', 'internal/server/testdata/go-checksum-public.json', 'docs/qualification/ci-diagnostics-recipient.pem', 'go.mod', '.github/workflows/go-checksum-client.yml']
permissions:
  contents: read
jobs:
  checksum-client:
    name: Stock Go checksum-on trust-state controls (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    concurrency:
      group: cratectl-go-checksum-client-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-amd64
            runner: ubuntu-24.04
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
          - arch: darwin-arm64
            runner: macos-15
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Select native OpenSSL 3
        if: runner.os == 'macOS'
        run: |
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          cratectl_ci_openssl_bin="$(brew --prefix openssl@3)/bin"
          "$cratectl_ci_openssl_bin/openssl" version
          printf '%s\n' "$cratectl_ci_openssl_bin" >> "$GITHUB_PATH"
      - name: Check bounded evidence export with stand-ins
        run: python3 scripts/test_go_checksum_client_report.py
      - name: Check actual stock Go checksum and failed-cache behavior
        run: python3 scripts/test_go_checksum_client.py --ci-report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-summary-checksum-client-${{ matrix.arch }}
          path: .cache/ci-go-checksum-client-summary.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: encrypted-checksum-client-${{ matrix.arch }}
          path: .cache/ci-go-checksum-client.cms
          if-no-files-found: error
          retention-days: 7
