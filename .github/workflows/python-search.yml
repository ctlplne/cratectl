name: Native Python repository search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/python-search.yml'
      - 'internal/server/pypi.go'
      - 'internal/server/python*.go'
      - 'internal/store/python*.go'
      - 'scripts/python_search_fixture.py'
      - 'scripts/ci/python_search_evidence.py'

permissions:
  contents: read

jobs:
  python-search:
    if: github.ref == 'refs/heads/main' && github.repository == 'ctlplne/cratectl'
    name: Stock Python search and real PostgreSQL (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    concurrency:
      group: cratectl-python-search-${{ github.ref }}-${{ matrix.arch }}-${{ github.sha }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GOENV: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Prepare pinned stock pip and Twine
        run: |
          umask 077
          python3 -m venv .cache/cratectl-python-tools
          .cache/cratectl-python-tools/bin/python -m pip install --disable-pip-version-check \
            --only-binary=:all: 'pip==26.1.2' 'twine==7.0.0'
      - name: Build the clean cratectl candidate
        run: make build BINDIR=.cache/cratectl-python-bin
      - name: Replay hosted and cached search with stock pip and Twine
        run: |
          umask 077
          mkdir -p .private
          python3 scripts/conformance_repository_manifest.py \
            --pg-bin /usr/lib/postgresql/16/bin --binary-directory .cache/cratectl-python-bin \
            --python-search-client .cache/cratectl-python-tools/bin/python --python-search-ci-architecture '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ci-summary-python-search-${{ matrix.arch }}
          path: .cache/ci-python-search.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
