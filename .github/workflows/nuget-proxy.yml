name: Native NuGet flat-container proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuget-proxy.yml'
      - 'internal/server/nuget_proxy*.go'
      - 'internal/server/nuget_group*.go'
      - 'internal/server/nuget_service_index*.go'
      - 'internal/store/nuget_proxy*.go'
      - 'internal/store/nuget_group*.go'
      - 'scripts/conformance_nuget_proxy.py'
      - 'scripts/conformance_nuget_group.py'
      - 'scripts/conformance_nuget_service.py'
      - 'scripts/ci/nuget_proxy_evidence.py'
      - 'scripts/ci/qualify_nuget_proxy.py'

permissions:
  contents: read

jobs:
  nuget-proxy:
    if: github.ref == 'refs/heads/main' && github.repository == 'ctlplne/cratectl'
    name: Stock NuGet proxy and real PostgreSQL (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    concurrency:
      group: cratectl-nuget-proxy-${{ github.ref }}-${{ matrix.arch }}-${{ github.sha }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GOENV: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build the clean cratectl candidate
        run: make build BINDIR=.cache/cratectl-nuget-proxy-bin
      - name: Replay stock dotnet against the governed NuGet proxy
        run: |
          umask 077
          mkdir -p .private
          python3 scripts/ci/qualify_nuget_proxy.py --pg-bin /usr/lib/postgresql/16/bin \
            --binary-directory .cache/cratectl-nuget-proxy-bin --architecture '${{ matrix.arch }}' --with-groups-and-service-index
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ci-summary-nuget-proxy-${{ matrix.arch }}
          path: .cache/ci-nuget-proxy.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
