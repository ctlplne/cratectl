name: Native npm repository search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/npm-search.yml'
      - 'internal/server/npm*.go'
      - 'internal/store/npm*.go'
      - 'scripts/npm_search_fixture.py'
      - 'scripts/ci/npm_search_evidence.py'

permissions:
  contents: read

jobs:
  npm-search:
    if: github.ref == 'refs/heads/main' && github.repository == 'ctlplne/cratectl'
    name: Stock npm search and real PostgreSQL (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    concurrency:
      group: cratectl-npm-search-${{ github.ref }}-${{ matrix.arch }}-${{ github.sha }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GOENV: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Build the clean cratectl candidate
        run: make build BINDIR=.cache/cratectl-npm-bin
      - name: Replay hosted and cached search with stock npm
        run: |
          umask 077
          mkdir -p .private
          python3 scripts/conformance_repository_manifest.py \
            --pg-bin /usr/lib/postgresql/16/bin --binary-directory .cache/cratectl-npm-bin \
            --npm-search --npm-search-ci-architecture '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ci-summary-npm-search-${{ matrix.arch }}
          path: .cache/ci-npm-search.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
