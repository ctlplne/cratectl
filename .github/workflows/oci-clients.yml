name: Native OCI clients

on:
  push:
    branches: [main]
    paths: ['cmd/**', 'internal/**', 'scripts/**', 'go.mod', 'go.sum', 'Makefile', '.github/workflows/oci-clients.yml']
  pull_request:
    paths: ['cmd/**', 'internal/**', 'scripts/**', 'go.mod', 'go.sum', 'Makefile', '.github/workflows/oci-clients.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clients:
    concurrency:
      group: cratectl-oci-${{ github.ref }}-${{ matrix.arch }}
      # Preserve running main jobs; queue each native profile independently.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    name: Docker, Podman and Helm (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CRATECTL_CI_CLIENT_SET: oci
      CRATECTL_CONFORMANCE_DATABASE_FILE: .private/ci-db.json
      CRATECTL_DEV_DATABASE: native
      CRATECTL_QUALIFICATION_BIN_DIR: .cache/ci-build
    services:
      cratectl-postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: cratectl_owner
          POSTGRES_DB: cratectl
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --publish 127.0.0.1:35432:5432
          --health-cmd "pg_isready -U cratectl_owner -d cratectl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Prepare isolated PostgreSQL and exact native registry binaries
        env:
          CRATECTL_CI_POSTGRES_CONTAINER_ID: ${{ job.services['cratectl-postgres'].id }}
        run: bash scripts/ci/bootstrap_linux.sh
      - name: Cache pinned public Helm archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: .cache/helm-v4.3.1-linux-${{ matrix.arch }}.tar.gz
          key: cratectl-tool-helm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/bootstrap_oci_clients.sh', 'scripts/ci/fetch_archive.py') }}
      - name: Verify bundled Podman and install checked Helm
        run: bash scripts/ci/bootstrap_oci_clients.sh
      - name: Publish and consume with native Docker, Podman and Helm
        run: python3 scripts/conformance_oci_clients.py --require-clean-build
      - name: Encrypt bounded native failure logs for local diagnosis
        if: failure()
        run: python3 scripts/ci_native_diagnostics.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: encrypted-native-diagnostics-${{ matrix.arch }}
          path: |
            .cache/ci-native-diagnostics.cms
            .cache/ci-native-diagnostics.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare bounded evidence summary
        if: always()
        run: python3 scripts/ci/evidence_summary.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-summary-oci-clients-${{ matrix.arch }}
          path: .cache/ci-evidence-summary.json
          if-no-files-found: error
          retention-days: 30
