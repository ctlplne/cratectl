name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and unit (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install console dependencies without package scripts
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Build, unit, race and lint
        run: |
          make build BINDIR=.cache/ci-build
          make test
          make race
          make lint
          make console-check
      - name: npm dependency audit
        run: npm audit --prefix web --audit-level=high --ignore-scripts

  security:
    name: Scoped source, binary and history scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries and scan called Go symbols
        run: |
          make build BINDIR=.cache/ci-security
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          "$(go env GOPATH)/bin/govulncheck" -mode=binary .cache/ci-security/cratectld
          "$(go env GOPATH)/bin/govulncheck" -mode=binary .cache/ci-security/cratectl
      - name: Scan current tree and complete reachable history for secrets
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          mkdir -p .cache/ci-source-snapshot
          git archive HEAD | tar -x -C .cache/ci-source-snapshot
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact --config .gitleaks.toml .cache/ci-source-snapshot
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml .

  native:
    name: Real PostgreSQL and stock clients (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CRATECTL_CONFORMANCE_DATABASE_FILE: .private/ci-db.json
      CRATECTL_DEV_DATABASE: native
      CRATECTL_QUALIFICATION_BIN_DIR: .cache/ci-build
      PLAYWRIGHT_BROWSERS_PATH: .cache/playwright-browsers
      NPM_CONFIG_USERCONFIG: /dev/null
    services:
      cratectl-postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: cratectl_owner
          POSTGRES_DB: cratectl
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 35432:5432
        options: >-
          --health-cmd "pg_isready -U cratectl_owner -d cratectl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install stock-client and console dependencies
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Prepare checked stock clients and fresh database
        run: bash scripts/ci/bootstrap_linux.sh
      - name: Real PostgreSQL integration and timing
        run: make integration BINDIR=.cache/ci-build
      - name: Stock client compatibility on real registry
        run: python scripts/conformance.py all --require-clean-build
      - name: Native lifecycle with curl, npm, pip, twine and Maven
        run: python scripts/conformance_native_lifecycle.py --require-clean-build
      - name: Chromium console workflows and accessibility
        if: matrix.arch == 'amd64'
        run: |
          web/node_modules/.bin/playwright install --with-deps chromium
          python scripts/conformance_console.py --require-clean-build
