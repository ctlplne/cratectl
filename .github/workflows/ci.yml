name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Select runtime qualification inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      # Keep a later documentation push from replacing an unexecuted source selector.
      group: cratectl-ci-selection-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    outputs:
      runtime: ${{ steps.select.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Select from exact bounded Git changes
        id: select
        run: python3 scripts/ci/select_changes.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-selection
          path: .cache/ci-selection.json
          if-no-files-found: error
          retention-days: 30

  source:
    needs: changes
    if: ${{ needs.changes.outputs.runtime == 'true' }}
    concurrency:
      group: cratectl-ci-source-${{ github.ref }}-${{ matrix.arch }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
      # Bind main jobs to their source so newer pushes cannot replace pending work.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    timeout-minutes: 30
    name: Source and unit (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install console dependencies without package scripts
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Select native OpenSSL 3 for encrypted diagnostic tests
        if: runner.os == 'macOS'
        run: |
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          cratectl_ci_openssl_bin="$(brew --prefix openssl@3)/bin"
          "$cratectl_ci_openssl_bin/openssl" version
          printf '%s\n' "$cratectl_ci_openssl_bin" >> "$GITHUB_PATH"
      - name: Build, unit, race and lint
        run: |
          make build BINDIR=.cache/ci-build
          make test
          make race
          make lint
          make console-check
      - name: npm dependency audit
        run: npm audit --prefix web --audit-level=high --ignore-scripts

  fuzz:
    needs: changes
    if: ${{ needs.changes.outputs.runtime == 'true' }}
    concurrency:
      group: cratectl-ci-fuzz-${{ github.ref }}-${{ matrix.arch }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
      # Bind main jobs to their source so newer pushes cannot replace pending work.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    name: Bounded native Go fuzz (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Exercise every checked-in fuzz target on this native runner
        run: python3 scripts/ci/fuzz_go.py

  security:
    concurrency:
      group: cratectl-ci-security-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
      # Bind main jobs to their source so newer pushes cannot replace pending work.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    timeout-minutes: 30
    name: Scoped source, binary and history scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries and scan called Go symbols
        run: |
          make build BINDIR=.cache/ci-security
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          "$(go env GOPATH)/bin/govulncheck" -mode=binary .cache/ci-security/cratectld
          "$(go env GOPATH)/bin/govulncheck" -mode=binary .cache/ci-security/cratectl
      - name: Cache pinned public Gitleaks archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: .cache/gitleaks_8.30.1_linux_x64.tar.gz
          key: cratectl-tool-gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/fetch_archive.py', '.github/workflows/ci.yml') }}
      - name: Scan current tree and complete reachable history for secrets
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          python3 scripts/ci/fetch_archive.py --archive "$archive" --url "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" --sha256 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb --max-bytes 33554432
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' ".cache/$archive" | sha256sum --check --status
          tar -xzf ".cache/$archive" -C "$RUNNER_TEMP" gitleaks
          test "$("$RUNNER_TEMP/gitleaks" version)" = 8.30.1
          mkdir -p .cache/ci-source-snapshot
          git archive HEAD | tar -x -C .cache/ci-source-snapshot
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact --config .gitleaks.toml .cache/ci-source-snapshot
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml .
      - name: Exercise narrow secret-rule exceptions with synthetic fixtures
        run: CRATECTL_GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" python3 scripts/test_secret_rules.py
      - name: Prepare bounded security evidence summary
        if: always()
        run: python3 scripts/ci/evidence_summary.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-summary-security
          path: .cache/ci-evidence-summary.json
          if-no-files-found: error
          retention-days: 30

  native:
    needs: changes
    if: ${{ needs.changes.outputs.runtime == 'true' }}
    concurrency:
      group: cratectl-ci-native-${{ github.ref }}-${{ matrix.arch }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
      # Bind main jobs to their source so newer pushes cannot replace pending work.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    name: Real PostgreSQL and stock clients (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CRATECTL_CONFORMANCE_DATABASE_FILE: .private/ci-db.json
      CRATECTL_DEV_DATABASE: native
      CRATECTL_QUALIFICATION_BIN_DIR: .cache/ci-build
      PLAYWRIGHT_BROWSERS_PATH: .cache/playwright-browsers
      NPM_CONFIG_USERCONFIG: /dev/null
    services:
      cratectl-postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: cratectl_owner
          POSTGRES_DB: cratectl
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --publish 127.0.0.1:35432:5432
          --health-cmd "pg_isready -U cratectl_owner -d cratectl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install stock-client and console dependencies
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Cache pinned public ORAS archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: .cache/oras_1.3.6_linux_${{ matrix.arch }}.tar.gz
          key: cratectl-tool-oras-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/bootstrap_linux.sh', 'scripts/ci/fetch_archive.py') }}
      - name: Prepare checked stock clients and fresh database
        env:
          CRATECTL_CI_POSTGRES_CONTAINER_ID: ${{ job.services['cratectl-postgres'].id }}
        run: bash scripts/ci/bootstrap_linux.sh
      - name: Real PostgreSQL integration and timing
        run: make integration BINDIR=.cache/ci-build
      - name: Real PostgreSQL integration with Go race detector
        run: make integration-race
      - name: Stock client compatibility on real registry
        run: python scripts/conformance.py all --require-clean-build
      - name: Native lifecycle with curl, npm, pip, twine and Maven
        run: python scripts/conformance_native_lifecycle.py --require-clean-build
      - name: Blank database initialization and trusted TLS client journey
        run: python scripts/conformance_installation.py --require-clean-build
      - name: Durable jobs and interrupted upload leases
        run: |
          python scripts/conformance_jobs.py --require-clean-build
          python scripts/conformance_leases.py --require-clean-build
      - name: Filesystem inventory and integrity sweeps
        run: |
          python scripts/conformance_inventory.py --require-clean-build
          python scripts/conformance_sweeps.py --require-clean-build
      - name: Cross-reference legal-hold matters
        run: python scripts/conformance_hold_matters.py --require-clean-build
      - name: Chromium console workflows and accessibility
        if: matrix.arch == 'amd64'
        run: |
          web/node_modules/.bin/playwright install --with-deps chromium
          python scripts/conformance_console.py --require-clean-build
      - name: Safe Chromium failure locations
        if: failure() && matrix.arch == 'amd64'
        run: python3 scripts/ci/browser_failure_summary.py
      - name: Encrypt bounded native failure observations for owner diagnosis
        if: failure()
        run: python3 scripts/ci_native_diagnostics.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: encrypted-native-diagnostics-${{ matrix.arch }}
          path: |
            .cache/ci-native-diagnostics.cms
            .cache/ci-native-diagnostics.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare bounded native evidence summary
        if: always()
        run: python3 scripts/ci/evidence_summary.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-summary-${{ matrix.arch }}
          path: .cache/ci-evidence-summary.json
          if-no-files-found: error
          retention-days: 30
