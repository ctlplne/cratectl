name: Native NuGet library contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['internal/nuget/**', 'internal/ziparchive/**', 'go.mod', 'go.sum', 'scripts/fixtures/nuget-versions/**', 'scripts/nuget_version_contract.py', 'scripts/qualification_contract.py', 'global.json', '.github/workflows/nuget-contract.yml']
  pull_request:
    paths: ['internal/nuget/**', 'internal/ziparchive/**', 'go.mod', 'go.sum', 'scripts/fixtures/nuget-versions/**', 'scripts/nuget_version_contract.py', 'scripts/qualification_contract.py', 'global.json', '.github/workflows/nuget-contract.yml']

permissions:
  contents: read

jobs:
  version:
    concurrency:
      group: cratectl-nuget-libraries-${{ github.ref }}-${{ matrix.arch }}
      # Preserve running main jobs; queue each native profile independently.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    name: Actual NuGet libraries versus Go (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Compare actual native libraries without remote package restore
        run: python3 scripts/nuget_version_contract.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-summary-nuget-version-${{ matrix.arch }}
          path: .cache/nuget-version-summary.json
          if-no-files-found: error
          retention-days: 30
