name: Focused browser regression

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Independent browser journey to replay five times
        type: choice
        default: repair
        options: [repair, retention, nuget]
  push:
    branches: [main]
    paths:
      - 'web/src/repair.tsx'
      - 'web/src/components.tsx'
      - 'web/src/repositories.tsx'
      - 'web/src/nuget-catalog.tsx'
      - 'web/tests/zzzz-repair.spec.mjs'
      - 'web/tests/zzzzzz-retention.spec.mjs'
      - 'web/tests/zzzzzzzzzzzz-nuget.spec.mjs'
      - 'scripts/conformance_console.py'
      - 'scripts/ci/browser_failure_summary.py'
      - 'scripts/ci/evidence_summary.py'
      - 'scripts/ci/bootstrap_linux.sh'
      - 'scripts/ci/check_schema_plan.py'
      - 'scripts/qualification_contract.py'
      - '.github/workflows/browser-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    concurrency:
      group: cratectl-browser-${{ github.ref }}-${{ matrix.workflow }}
      # Preserve running main jobs; queue each native profile independently.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    name: Real x86 Chromium ${{ matrix.workflow }} replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        workflow: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.workflow) || '["repair","retention","nuget"]') }}
    env:
      CRATECTL_CONFORMANCE_DATABASE_FILE: .private/ci-db.json
      CRATECTL_DEV_DATABASE: native
      CRATECTL_QUALIFICATION_BIN_DIR: .cache/ci-build
      PLAYWRIGHT_BROWSERS_PATH: .cache/playwright-browsers
      NPM_CONFIG_USERCONFIG: /dev/null
      CRATECTL_BROWSER_WORKFLOW: ${{ matrix.workflow }}
    services:
      cratectl-postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: cratectl_owner
          POSTGRES_DB: cratectl
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --publish 127.0.0.1:35432:5432
          --health-cmd "pg_isready -U cratectl_owner -d cratectl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare real database, registry and Chromium
        env:
          CRATECTL_CI_POSTGRES_CONTAINER_ID: ${{ job.services['cratectl-postgres'].id }}
        run: |
          npm ci --prefix web --ignore-scripts --no-audit --no-fund
          bash scripts/ci/bootstrap_linux.sh
          web/node_modules/.bin/playwright install --with-deps chromium
      - name: Replay selected journey five times with independent fresh databases
        run: |
          for attempt in 1 2 3 4 5; do
            echo "$CRATECTL_BROWSER_WORKFLOW replay $attempt of 5"
            python3 scripts/conformance_console.py --workflow "$CRATECTL_BROWSER_WORKFLOW" --require-clean-build
          done
      - name: Safe failure locations and matcher labels
        if: failure()
        run: python3 scripts/ci/browser_failure_summary.py
      - name: Encrypt bounded browser failure observations for owner diagnosis
        if: failure()
        run: python3 scripts/ci_native_diagnostics.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: encrypted-browser-diagnostics-${{ matrix.workflow }}
          path: |
            .cache/ci-native-diagnostics.cms
            .cache/ci-native-diagnostics.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare bounded evidence summary
        if: always()
        run: python3 scripts/ci/evidence_summary.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-summary-${{ matrix.workflow }}-browser
          path: .cache/ci-evidence-summary.json
          if-no-files-found: error
          retention-days: 30
