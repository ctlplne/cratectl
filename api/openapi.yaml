openapi: 3.1.0
info:
  title: cratectl initial management API
  version: 0.0.1-dev
  description: Early engineering contract. Protocol, CLI and production qualification remain incomplete.
servers:
  - url: https://localhost:38443
security:
  - serviceToken: []
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  parameters:
    MatterName:
      in: path
      name: matter
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
    MatterSequence:
      in: path
      name: operation
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    MatterLimit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 100, default: 100}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    Repository:
      in: path
      name: repository
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
    ListLimit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}
      description: Maximum candidates per live page. Byte and graph-work budgets may shorten a page; follow returned cursors even when items is empty.
    ListCursor:
      in: query
      name: cursor
      schema: {type: string, maxLength: 3000}
      description: Use the returned next or previous opaque cursor unchanged with the same credential, endpoint and filters. Restart at the first page after key rotation or an invalid cursor.
    ListSearch:
      in: query
      name: q
      schema: {type: string, maxLength: 256}
      description: Literal case-insensitive substring search, at most 256 UTF-8 bytes without control characters. Repositories match name/format/mode; references match path/digest. Searches cover all authorized pages.
  schemas:
    HoldMatter:
      type: object
      required: [name, revision, state, title, reason, actor, created_sequence, change_sequence, changed_at]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
        revision: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [open, closed]}
        title: {type: string, minLength: 1, maxLength: 256}
        reason: {type: string, minLength: 1, maxLength: 1024}
        actor: {type: string}
        created_sequence: {type: integer, format: int64, minimum: 1}
        change_sequence: {type: integer, format: int64, minimum: 1}
        changed_at: {type: string, format: date-time}
    HoldMatterRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, state, title, reason]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775806}
        state: {type: string, enum: [open, closed]}
        title: {type: string, minLength: 1, maxLength: 256, description: At most 256 UTF-8 bytes without control characters}
        reason: {type: string, minLength: 1, maxLength: 1024, description: Nonblank and at most 1024 UTF-8 bytes without control characters}
        dry_run: {type: boolean, default: false}
    MatterSelector:
      type: object
      additionalProperties: false
      required: [repository, path]
      properties:
        repository: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
        path: {type: string, maxLength: 2048, description: Canonical immutable OCI manifest or blob digest path}
    MatterPreviewRequest:
      type: object
      additionalProperties: false
      required: [action, reason, targets]
      properties:
        action: {type: string, enum: [hold, release_hold]}
        reason: {type: string, minLength: 1, maxLength: 1024}
        hold_until: {type: string, format: date-time, description: Future expiry for placement only; omit for indefinite placement and release}
        targets:
          type: array
          minItems: 1
          maxItems: 10000
          description: Complete explicit reference list; duplicate references fail; server resource budgets may be smaller
          items: {$ref: '#/components/schemas/MatterSelector'}
    MatterTarget:
      type: object
      additionalProperties: false
      required: [ordinal, repository, path, digest, revision, status, effective_held, lifecycle_revision]
      properties:
        ordinal: {type: integer, format: int64, minimum: 1}
        repository: {type: string}
        path: {type: string, maxLength: 2048}
        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        revision: {type: integer, format: int64, minimum: 0, description: Revision of this matter membership; zero means new}
        status: {type: string, enum: [new, active, expired, released]}
        effective_held: {type: boolean, description: Union of every protection at preview time}
        lifecycle_revision: {type: integer, format: int64, minimum: 0}
    MatterPlan:
      type: object
      additionalProperties: false
      required: [matter, action, reason, requester, evaluated_at, expires_at, target_count, preview_digest]
      properties:
        matter: {$ref: '#/components/schemas/HoldMatter'}
        action: {type: string, enum: [hold, release_hold]}
        reason: {type: string, minLength: 1, maxLength: 1024}
        hold_until: {type: string, format: date-time}
        requester: {type: string}
        evaluated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: Fifteen minutes after evaluation; worker effects must also precede this deadline}
        target_count: {type: integer, minimum: 1, maximum: 10000}
        targets: {type: array, minItems: 1, maxItems: 10000, items: {$ref: '#/components/schemas/MatterTarget'}, description: Complete for preview and admission; omitted from stored operation summary; inspect immutable target pages}
        preview_digest: {type: string, pattern: '^[a-f0-9]{64}$', description: Binds the complete manifest to its tenant and original credential}
    MatterOperation:
      type: object
      required: [sequence, matter, revision, state, plan, requester, expires_at, change_sequence, created_at, changed_at]
      properties:
        sequence: {type: integer, format: int64, minimum: 1}
        matter: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [awaiting_approval, approved, cancelled]}
        plan: {$ref: '#/components/schemas/MatterPlan'}
        requester: {type: string}
        approver: {type: string}
        approval_reason: {type: string}
        expires_at: {type: string, format: date-time}
        job: {type: string, description: Durable job ID when admitted; inspect detail for actual progress and terminal state}
        change_sequence: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        changed_at: {type: string, format: date-time}
    MatterReview:
      type: object
      additionalProperties: false
      required: [expected_revision, preview_digest, reason]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775806}
        preview_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        reason: {type: string, minLength: 1, maxLength: 1024}
    RetentionPolicyRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, min_age_seconds, keep_last, protect_tagged, enabled, reason]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775806}
        min_age_seconds: {type: integer, minimum: 60, maximum: 315360000, description: Age since creation of the canonical manifest reference; not last download or tag update.}
        keep_last: {type: integer, minimum: 0, maximum: 1000000, description: Number of newest live canonical manifests to retain per image name; zero disables this rule.}
        protect_tagged: {type: boolean, description: Keep every manifest with a current live tag. A changed tag set after admission always requires a new preview.}
        enabled: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 1024, description: Nonempty UTF-8 reason of at most 1024 bytes without controls.}
        dry_run: {type: boolean, default: false}
    RetentionRunRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, reason]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1024}
        dry_run: {type: boolean, default: false}
        evaluated_at: {type: string, format: date-time, description: Required for apply; copy the exact evaluation time from the approved preview.}
        preview_digest: {type: string, pattern: '^[a-f0-9]{64}$', description: Required for apply within five minutes of evaluated_at; binds the complete plan and its observed impact.}
    RetentionScheduleRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, expected_policy_revision, expected_source_revision, interval_seconds, max_targets, enabled, authorize_future_retirements, reason]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775806}
        expected_policy_revision: {type: integer, format: int64, minimum: 1}
        expected_source_revision: {type: integer, format: int64, minimum: 0}
        interval_seconds: {type: integer, minimum: 60, maximum: 31536000}
        max_targets: {type: integer, minimum: 1, maximum: 10000, description: The complete capture must fit this approved maximum and the server target ceiling. No partial target set is admitted.}
        enabled: {type: boolean}
        authorize_future_retirements: {type: boolean, description: Must be explicitly true to enable future target captures under these exact policy and source revisions.}
        reason: {type: string, minLength: 1, maxLength: 1024, description: Nonempty UTF-8 reason of at most 1024 bytes without control characters.}
        run_immediately: {type: boolean, default: false, description: Make the first slot due at configuration commit; requires enabled true.}
        dry_run: {type: boolean, default: false, description: Preview complete configuration without changing future authority or admitting work.}
      allOf:
        - if: {properties: {enabled: {const: true}}, required: [enabled]}
          then: {properties: {authorize_future_retirements: {const: true}}}
        - if: {properties: {run_immediately: {const: true}}, required: [run_immediately]}
          then: {properties: {enabled: {const: true}}}
    IntegrityScheduleRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, interval_seconds, sample_size, enabled, reason]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775806, description: Zero creates a schedule; otherwise use its exact current revision.}
        repository: {type: string, maxLength: 63, description: Empty or omitted selects the authenticated tenant; group endpoints do not own retained bytes.}
        interval_seconds: {type: integer, minimum: 60, maximum: 31536000}
        sample_size: {type: integer, minimum: 1, maximum: 1000000, description: Also bounded by the operator target budget.}
        enabled: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 1024, description: At most 1024 UTF-8 bytes without control characters.}
        run_immediately: {type: boolean, default: false, description: Make the first slot due at configuration commit; requires enabled true.}
        dry_run: {type: boolean, default: false, description: Preview without retaining configuration or reauthorizing future work.}
    ManagementPage:
      type: object
      required: [items, limit, next, previous, scope]
      properties:
        items: {type: array, items: {type: object}}
        limit: {type: integer}
        next: {type: string}
        previous: {type: string}
        scope: {type: string}
      description: Live repeatable-read page; no fixed total-result ceiling. Grants and ordinary decisions filter before SQL bounds; OCI graph checks may produce an empty visible page with continuation. Cursors encrypt hidden scan positions. Each request rechecks current credentials, grants and policy. Concurrent insertions before a cursor require a first-page restart.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, action]
          properties:
            code: {type: string}
            action: {type: string}
    Job:
      type: object
      description: Tenant-scoped durable handler state; lease tokens are never returned.
      properties:
        sequence: {type: integer, format: int64}
        task: {type: string}
        handler: {type: string, enum: [event.project, storage.integrity, storage.sweep, storage.inventory, storage.repair, leases.reconcile, repository.retention]}
        queue: {type: string, enum: [events, integrity, maintenance]}
        kind: {type: string, description: "Source event kind, artifact.integrity, storage.sweep or leases.reconcile; handler identifies the actual effect."}
        state: {type: string, enum: [pending, running, retry, succeeded, failed, cancel_requested, cancelled, uncertain]}
        attempts: {type: integer, minimum: 0, description: Total attempts retained across operator redrives.}
        cycle_attempts: {type: integer, minimum: 0}
        generation: {type: integer, format: int64}
        worker: {type: string}
        lease_until: {type: string, format: date-time}
        available_at: {type: string, format: date-time}
        last_error: {type: string, description: Classified code; no private transport error or credential value.}
        updated_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        target:
          type: object
          description: Canonical integrity binding, empty event target, or durable maintenance progress with cutoff, phase, cursor and recovery counts.
    QueuePolicy:
      type: object
      additionalProperties: false
      required: [capacity, max_running, max_attempts, retry_seconds, retry_max_seconds]
      properties:
        queue: {type: string, enum: [events, integrity, maintenance]}
        capacity: {type: integer, minimum: 1, maximum: 2147483647, default: 100000}
        max_running: {type: integer, minimum: 1, maximum: 100000, default: 2}
        max_attempts: {type: integer, minimum: 1, maximum: 10000, default: 5}
        retry_seconds: {type: integer, minimum: 1, maximum: 604800, default: 5}
        retry_max_seconds: {type: integer, minimum: 1, maximum: 604800, default: 300, description: Must be at least retry_seconds.}
    JobId:
      type: string
      pattern: '^[1-9][0-9]*:(event|integrity-[a-f0-9]{64}|reconcile-[a-f0-9]{64}|sweep-[a-f0-9]{64}|inventory-[a-f0-9]{64}|repair-[a-f0-9]{64})$'
      description: Tenant-local source sequence plus effect key; equal IDs may exist in different tenants.
    HoldState:
      type: object
      required: [repository, path, digest, deleted, held, revision, actor, change_sequence]
      properties:
        repository: {type: string}
        path: {type: string, maxLength: 2048}
        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        deleted: {type: boolean}
        held: {type: boolean, description: Held at the observation or original receipt time}
        legacy_held: {type: boolean, description: Original hold slot is active at the observation time; absent in older immutable receipts}
        case_held: {type: boolean, description: At least one independent case is active at the observation time; absent in older immutable receipts}
        revision: {type: integer, format: int64, minimum: 0}
        hold_reason: {type: string, description: Present while a recorded hold reason remains}
        hold_until: {type: string, format: date-time, description: Omitted for an indefinite hold or a released hold}
        reason: {type: string, description: Reason of the latest lifecycle change or original receipt}
        actor: {type: string}
        changed_at: {type: string, format: date-time}
        change_sequence: {type: integer, format: int64}
    HoldRecord:
      allOf:
        - {$ref: '#/components/schemas/HoldState'}
        - type: object
          required: [status, repository_state, format, mode]
          properties:
            status: {type: string, enum: [active, expired, released]}
            repository_state: {type: string, enum: [active, suspended, removed]}
            format: {type: string}
            mode: {type: string}
    HoldChange:
      type: object
      required: [sequence, action, state, actor, recorded_at, event_hash]
      properties:
        sequence: {type: integer, format: int64, minimum: 1}
        action: {type: string, enum: [hold, release_hold]}
        state: {$ref: '#/components/schemas/HoldState'}
        actor: {type: string}
        recorded_at: {type: string, format: date-time}
        event_hash: {type: string, pattern: '^[a-f0-9]{64}$', description: Identifies the full journal event; the filtered snapshot alone is not a complete audit-chain proof}
    HoldCase:
      type: object
      required: [repository, path, digest, case_id, revision, held, released, created_sequence, change_sequence]
      properties:
        repository: {type: string}
        path: {type: string, maxLength: 2048}
        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        case_id: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$', description: Scoped to this repository and immutable reference; legacy is reserved}
        revision: {type: integer, format: int64, minimum: 0}
        held: {type: boolean, description: This case is unreleased and unexpired at observation time}
        released: {type: boolean}
        hold_reason: {type: string, description: Last preservation reason; retained after release}
        hold_until: {type: string, format: date-time, description: Omitted for indefinite preservation; retained after release}
        reason: {type: string, description: Latest case-change reason}
        actor: {type: string}
        changed_at: {type: string, format: date-time}
        created_sequence: {type: integer, format: int64, description: Immutable inventory position from first creation; zero for a new case}
        change_sequence: {type: integer, format: int64}
    HoldCaseRequest:
      type: object
      additionalProperties: false
      required: [path, digest, action, expected_revision, reason]
      properties:
        path: {type: string, maxLength: 2048}
        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        action: {type: string, enum: [hold, release_hold]}
        expected_revision: {type: integer, format: int64, minimum: 0, description: This named case revision; zero for a new case; independent cases have independent revisions}
        reason: {type: string, minLength: 1, maxLength: 1024, description: Nonblank reason at most 1024 UTF-8 bytes without control characters}
        hold_until: {type: string, format: date-time, description: Optional future expiry for hold; omit for indefinite preservation and release}
        dry_run: {type: boolean, default: false}
    HoldCasePreview:
      type: object
      required: [case, current, action, retained_bytes, dry_run]
      properties:
        case: {$ref: '#/components/schemas/HoldCase'}
        current: {$ref: '#/components/schemas/HoldState'}
        action: {type: string, enum: [hold, release_hold]}
        retained_bytes: {const: true}
        dry_run: {type: boolean}
    HoldCaseChange:
      type: object
      required: [sequence, action, case, current, actor, recorded_at, event_hash]
      properties:
        sequence: {type: integer, format: int64}
        action: {type: string, enum: [hold, release_hold]}
        case: {$ref: '#/components/schemas/HoldCase'}
        current: {$ref: '#/components/schemas/HoldState'}
        actor: {type: string}
        recorded_at: {type: string, format: date-time}
        event_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
paths:
  /api/v1/hold-matters:
    get:
      summary: Discover tenant-wide cross-reference preservation matters
      description: Current tenant administrator required. Live bounded pages use literal search across name/title/state/reason. Unknown or repeated query parameters fail. Every matter remains independent of per-reference cases and the legacy hold slot.
      parameters:
        - {$ref: '#/components/parameters/MatterLimit'}
        - {$ref: '#/components/parameters/ListCursor'}
        - {$ref: '#/components/parameters/ListSearch'}
      responses:
        '200': {description: 'Page of HoldMatter items with limit, next, previous and credential-bound scope'}
        '400': {description: Invalid query or differently scoped cursor}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '503': {description: Page byte budget or database failure}
  /api/v1/hold-matters/{matter}:
    parameters:
      - {$ref: '#/components/parameters/MatterName'}
    get:
      summary: Read current matter metadata
      responses:
        '200':
          description: Current matter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HoldMatter'}
        '400': {description: Invalid name or query}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '404': {description: Matter not found in this tenant}
    put:
      summary: Create or change matter metadata under its exact revision
      description: Zero revision creates an open matter. Closing requires every membership released and no pending proposal or live job. Editing metadata fences prior previews and jobs. Dry-run writes nothing. Applied metadata plus journal plus outbox plus idempotent response commit together.
      parameters:
        - in: header
          name: Idempotency-Key
          schema: {type: string, minLength: 8, maxLength: 128}
          description: Required unless dry_run is true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HoldMatterRequest'}
      responses:
        '200': {description: Matter snapshot plus dry_run and retained_bytes true}
        '400': {description: Invalid body or missing review fields}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required including on replay}
        '409': {description: Stale revision or unreleased memberships or unfinished work}
        '413': {description: Body exceeds 16 KiB}
        '503': {description: Queue or database failure; no transition committed}
  /api/v1/hold-matters/{matter}/members:
    parameters:
      - {$ref: '#/components/parameters/MatterName'}
    get:
      summary: Read matter membership including retained and deleted references
      parameters:
        - {$ref: '#/components/parameters/MatterLimit'}
        - {$ref: '#/components/parameters/ListCursor'}
        - {$ref: '#/components/parameters/ListSearch'}
        - in: query
          name: state
          schema: {type: string, enum: [active, expired, released, all], default: active}
        - in: query
          name: repository
          schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
      responses:
        '200': {description: 'Membership page includes immutable coordinates/digest/creation sequence; independent revision; preservation reason/expiry; latest reason/actor; held/released/status; repository_state and deleted. Page includes observed_at and encrypted continuation fields.'}
        '400': {description: Invalid filters or differently scoped cursor}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '404': {description: Matter not found}
        '503': {description: Page byte budget or database failure}
  /api/v1/hold-matters/{matter}/operations/preview:
    parameters:
      - {$ref: '#/components/parameters/MatterName'}
    post:
      summary: Resolve a complete bounded immutable membership manifest without writing state
      description: Canonical OCI references only. Sorted duplicate-free explicit targets resolve to current digest and revisions. The complete response including digest must fit the metadata budget. No truncated preview is admitted. The original current administrator credential must submit the exact plan within fifteen minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatterPreviewRequest'}
      responses:
        '200':
          description: Complete reviewed plan including every target
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatterPlan'}
        '400': {description: Invalid or duplicate targets or resource ceiling exceeded}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '404': {description: Matter or reference not found}
        '409': {description: Closed matter or missing release membership or invalid reference or expiry}
        '413': {description: Complete manifest or request exceeds metadata budget; narrow the explicit target set}
  /api/v1/hold-matters/{matter}/operations:
    parameters:
      - {$ref: '#/components/parameters/MatterName'}
    get:
      summary: Read immutable operation summaries and their current review state
      parameters:
        - {$ref: '#/components/parameters/MatterLimit'}
        - {$ref: '#/components/parameters/ListCursor'}
      responses:
        '200': {description: Page of MatterOperation summaries; target manifests are separate bounded immutable pages}
        '400': {description: Invalid query or differently scoped cursor}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '404': {description: Matter not found}
        '503': {description: Page byte budget or database failure}
    post:
      summary: Admit the exact preview as placement work or an independently reviewed release proposal
      description: Echo the full preview unchanged. Current state and complete plan bytes are rechecked under the tenant lock. Placement admits a maintenance job; release stays awaiting_approval with no release job. Immutable plan and targets plus journal plus applicable job/outbox plus idempotent response commit together. New members outside this manifest remain protected.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/MatterPlan'}
                - {required: [targets]}
      responses:
        '202': {description: MatterOperation summary in operation plus matter_name and retained_bytes true}
        '400': {description: Invalid complete plan or missing explicit fields or key}
        '401': {description: Expired or revoked credential including on replay}
        '403': {description: Current tenant administrator required}
        '404': {description: Matter or reference not found}
        '409': {description: Altered or expired or stale preview or idempotency conflict}
        '413': {description: Complete plan or request exceeds metadata budget}
        '503': {description: Queue or database failure; no operation committed}
  /api/v1/hold-matters/{matter}/operations/{operation}:
    parameters:
      - {$ref: '#/components/parameters/MatterName'}
      - {$ref: '#/components/parameters/MatterSequence'}
    get:
      summary: Read actual durable progress and job state for one operation
      description: Processed targets include changed or already released skips. all_targets_processed requires the complete manifest observed and job succeeded; it does not mean every target was changed. The operation review state approved is separate from actual job completion.
      responses:
        '200': {description: 'Operation summary plus processed, effected, skipped, remaining, retained_bytes and job/all_targets_processed when admitted'}
        '400': {description: Invalid path or query}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '404': {description: Matter operation not found}
  /api/v1/hold-matters/{matter}/operations/{operation}/items:
    parameters:
      - {$ref: '#/components/parameters/MatterName'}
      - {$ref: '#/components/parameters/MatterSequence'}
    get:
      summary: Inspect every immutable target and its once-only observed outcome
      parameters:
        - {$ref: '#/components/parameters/MatterLimit'}
        - {$ref: '#/components/parameters/ListCursor'}
      responses:
        '200': {description: 'Page of MatterTarget fields plus outcome pending/held/released/already_released/changed, member_revision, outcome_revision, optional effective_held_after and observed_at. Completed outcomes survive cancellation and retry.'}
        '400': {description: Invalid query or differently scoped cursor}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '404': {description: Matter operation not found}
        '503': {description: Page byte budget or database failure}
  /api/v1/hold-matters/{matter}/operations/{operation}/approve:
    parameters:
      - {$ref: '#/components/parameters/MatterName'}
      - {$ref: '#/components/parameters/MatterSequence'}
    post:
      summary: Approve an exact release proposal as a different current administrator
      description: The requester actor cannot approve with another token. Both original requester and approver must remain current through every worker effect. Approval plus immutable job binding plus journal/outbox plus idempotent response commit together. Retry never substitutes the administrator operating job controls. Recover revoked or expired intent through a fresh preview and independently reviewed proposal for remaining targets.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatterReview'}
      responses:
        '202': {description: Approved MatterOperation in operation with its durable maintenance job ID}
        '400': {description: Invalid review or missing explicit revision or key}
        '401': {description: Expired or revoked current credential}
        '403': {description: Same requester actor or changed original authority or nonadministrator}
        '404': {description: Matter operation not found}
        '409': {description: Stale revision or digest or metadata or deadline or nonpending proposal}
        '503': {description: Queue or database failure; approval and job rolled back}
  /api/v1/hold-matters/{matter}/operations/{operation}/cancel:
    parameters:
      - {$ref: '#/components/parameters/MatterName'}
      - {$ref: '#/components/parameters/MatterSequence'}
    post:
      summary: Cancel a still-pending release proposal under its exact revision and digest
      description: Any current tenant administrator can cancel stranded pending approval without taking over its authority. Use ordinary job cancellation after admission; committed effects remain and unobserved targets stop when cancellation is observed.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatterReview'}
      responses:
        '202': {description: Cancelled MatterOperation in operation with no admitted release job}
        '400': {description: Invalid review or missing explicit revision or key}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '404': {description: Matter operation not found}
        '409': {description: Stale revision or digest or proposal already admitted or cancelled}
        '503': {description: Queue or database failure; no cancellation committed}
  /api/v1/hold-matters/{matter}/history:
    parameters:
      - {$ref: '#/components/parameters/MatterName'}
    get:
      summary: Read original immutable matter events in journal order
      parameters:
        - {$ref: '#/components/parameters/MatterLimit'}
        - {$ref: '#/components/parameters/ListCursor'}
      responses:
        '200': {description: 'Bounded matter-event page includes sequence, kind, actor, data, recorded_at and event_hash. Original target snapshots retain their observed protection; this filtered list is not a complete audit-chain proof.'}
        '400': {description: Invalid query or differently scoped cursor}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '404': {description: Matter not found}
        '503': {description: Page byte budget or database failure}
  /api/v1/hold-cases:
    get:
      summary: Discover independent hold cases as a current tenant administrator
      description: Live bounded pages include canonical OCI references in retained repositories. Each case has its own revision and expiry. Status applies to that case only. Releasing it never changes another case or the legacy hold slot. Creation sequence gives a stable order while concurrent changes and expiry can change filter membership. Unknown and repeated parameters fail.
      parameters:
        - in: query
          name: state
          schema: {type: string, enum: [active, expired, released, all], default: active}
        - in: query
          name: repository
          schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
        - in: query
          name: path
          schema: {type: string, maxLength: 2048}
        - in: query
          name: case_id
          schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
        - {$ref: '#/components/parameters/ListSearch'}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - {$ref: '#/components/parameters/ListCursor'}
      responses:
        '200': {description: 'Items contain HoldCase fields plus status and repository_state. The page includes observed_at, limit, next, previous and scope. Encrypted continuations bind endpoint, filters and current credential.'}
        '400': {description: "Malformed filters, repeated fields or differently scoped continuation"}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '503': {description: "Byte budget, schema or database failure; no partial record returned"}
  /api/v1/repositories/{repository}/artifacts/holds/{case_id}:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
      - in: path
        name: case_id
        required: true
        schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
    get:
      summary: Read one independent case or revision zero for a new case
      parameters:
        - in: query
          name: path
          required: true
          schema: {type: string, maxLength: 2048}
      responses:
        '200':
          description: Current case state with exact retained reference digest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HoldCase'}
        '400': {description: Malformed query}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '404': {description: Canonical reference or repository not found}
        '409': {description: Invalid name or noncanonical reference}
    put:
      summary: Preview or apply a case-specific preservation decision
      description: Expected revision belongs only to this case. Placement updates or reopens that case; release retains its reason and expiry and affects no other protection. Every applied change also advances the common lifecycle revision to invalidate earlier destructive previews. Current administrator authority applies even to exact idempotent replay. Effect plus journal plus job intent plus idempotency response commit together. Dry-run changes no state. Suspended or removed repositories remain fenced from serving.
      parameters:
        - in: header
          name: Idempotency-Key
          description: Required unless dry_run is true; reuse only for the identical request
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HoldCaseRequest'}
      responses:
        '200':
          description: Current case and aggregate reference state at preview or committed change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HoldCasePreview'}
        '400': {description: Invalid JSON or missing explicit revision or idempotency key}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required including on replay}
        '404': {description: Canonical reference or repository not found}
        '409': {description: "Stale case revision, changed digest, invalid action or expiry, or already released case"}
        '413': {description: Request exceeds 16 KiB}
        '503': {description: "Queue, schema or database failure; entire transition rolled back"}
  /api/v1/repositories/{repository}/artifacts/holds/{case_id}/history:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
      - in: path
        name: case_id
        required: true
        schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
    get:
      summary: Read original immutable changes for one named reference case
      description: Returns actual journal snapshots ordered by event sequence. Expiry invents no release event. The case snapshot and aggregate state retain their original meaning; filtered event hashes identify receipts in the complete audit export.
      parameters:
        - in: query
          name: path
          required: true
          schema: {type: string, maxLength: 2048}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - {$ref: '#/components/parameters/ListCursor'}
      responses:
        '200': {description: 'Bounded items of HoldCaseChange with limit, next, previous and scope. Cursor binds the case, reference and current credential.'}
        '400': {description: Invalid query or differently scoped continuation}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator required}
        '404': {description: Canonical reference or repository not found}
        '503': {description: "Byte budget, schema or database failure; no partial record returned"}
  /api/v1/session:
    get:
      summary: Read current authenticated tenant identity and supported native adapters
      responses:
        '200':
          description: Current tenant, actor, role, public_url and implemented format names. No credential, credential hash or browser cookie is returned. Rechecks the current credential.
          content:
            application/json:
              schema:
                type: object
                required: [tenant, actor, role, public_url, formats]
                properties:
                  tenant: {type: string}
                  actor: {type: string}
                  role: {type: string, enum: [admin, writer, reader]}
                  public_url: {type: string}
                  formats: {type: array, items: {type: string}}
        '401': {description: "Missing, expired, revoked or worker-purpose credential"}
  /api/v1/repositories:
    get:
      operationId: listRepositories
      parameters:
        - {$ref: '#/components/parameters/ListLimit'}
        - {$ref: '#/components/parameters/ListCursor'}
        - {$ref: '#/components/parameters/ListSearch'}
      responses:
        '200':
          description: Current authorized repositories; nonadministrators receive no source settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagementPage'}
        '400': {description: "Invalid, repeated or unknown query parameter, or tampered/differently scoped cursor."}
        '401': {description: "Missing, revoked or expired service credential."}
    post:
      operationId: createRepository
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, format]
              properties:
                name: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
                format: {type: string, enum: [generic, maven, npm, pypi, oci]}
                require_review: {type: boolean, default: false}
                mode: {type: string, enum: [hosted, proxy, group], default: hosted}
                access: {type: string, enum: [tenant, restricted], default: tenant}
                settings:
                  type: object
                  description: Early proxy/group implementations exist for generic, Maven, npm, PyPI and OCI. Administrators can replace complete source settings through the versioned configuration endpoint. Full format qualification remains open.
                  properties:
                    upstream:
                      type: object
                      required: [url, networks]
                      properties:
                        url: {type: string, format: uri, maxLength: 2048}
                        networks: {type: array, minItems: 1, maxItems: 64, items: {type: string}}
                        credential_ref: {type: string, description: Operator-owned tenant-scoped reference; never a credential value.}
                        authentication: {type: string, enum: [bearer, basic], default: bearer}
                        allow_signed_query: {type: boolean, default: false, description: "OCI proxy delivery redirects, descriptor URLs and catalog links. Permit bounded opaque query strings at this authority; signatures are validated by the source. Exact origin catalog cursors use a resource-scoped permission."}
                    cache:
                      type: object
                      properties:
                        fresh_seconds: {type: integer, minimum: 0, maximum: 86400}
                        negative_seconds: {type: integer, minimum: 0, maximum: 3600}
                        stale_seconds: {type: integer, minimum: 0, maximum: 604800}
                        require_checksum: {type: boolean, default: false}
                        allow_no_store: {type: boolean, default: false}
                        allow_legacy_npm_shasum: {type: boolean, default: false, description: Explicit compatibility fallback when strong SRI is absent; require_checksum disables this fallback.}
                    oci_token_endpoint:
                      type: object
                      description: Explicit OCI proxy token realm with separate network and credential authority. The challenged realm must match its exact URL.
                      required: [url, networks]
                      properties:
                        url: {type: string, format: uri, maxLength: 2048}
                        networks: {type: array, minItems: 1, maxItems: 64, items: {type: string}}
                        credential_ref: {type: string}
                        authentication: {type: string, enum: [bearer, basic], default: bearer}
                    oci_token_service: {type: string, maxLength: 255, description: Exact OCI token service audience. Pull scope is derived from the configured source repository path.}
                    download_sources:
                      type: array
                      maxItems: 16
                      description: npm/PyPI/OCI proxy only. Explicit additional download authorities; OCI descriptor URLs and each redirect use only the selected approved source credentials. OCI signed queries require allow_signed_query and are never retained as cache bindings.
                      items:
                        type: object
                        required: [url, networks]
                        properties:
                          url: {type: string, format: uri, maxLength: 2048}
                          networks: {type: array, minItems: 1, maxItems: 64, items: {type: string}}
                          credential_ref: {type: string}
                          authentication: {type: string, enum: [bearer, basic], default: bearer}
                          allow_signed_query: {type: boolean, default: false, description: OCI only. Permit bounded ephemeral signed query strings; ordinary durable npm/PyPI download URLs still reject queries.}
                    python_index_format: {type: string, enum: [auto, html, json], default: auto, description: PyPI proxy content negotiation preference.}
                    members: {type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: {type: string}}
                    namespace_owners: {type: object, maxProperties: 128, additionalProperties: {type: string}}
      responses:
        '201': {description: "Hosted repository created; replay returns original response."}
        '400': {description: "Invalid request or missing idempotency key."}
        '403': {description: "Tenant admin required."}
        '409': {description: "Duplicate name or changed request under an existing key."}
  /api/v1/repositories/{repository}/artifacts:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    get:
      operationId: listArtifacts
      parameters:
        - {$ref: '#/components/parameters/ListLimit'}
        - {$ref: '#/components/parameters/ListCursor'}
        - {$ref: '#/components/parameters/ListSearch'}
        - in: query
          name: metadata
          schema: {type: string, enum: [omit]}
          description: Optional bounded summary. Every returned reference sets metadata_omitted=true and metadata={}; fetch its current full reference separately.
      responses:
        '200':
          description: Current tenant references; administrator inventory includes quarantine, other roles see permitted references after complete OCI graph policy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagementPage'}
        '400': {description: "Invalid, repeated or unknown query parameter, or tampered/differently scoped cursor."}
        '403': {description: Current repository grant denied.}
        '404': {description: "Repository absent from caller tenant."}
  /api/v1/repositories/{repository}:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    get:
      operationId: inspectRepository
      responses:
        '200': {description: Current authorized repository; source settings excluded for nonadministrators.}
        '403': {description: Current repository grant denied.}
        '404': {description: Repository absent from caller tenant.}
  /api/v1/repositories/{repository}/artifacts/reference:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    get:
      operationId: inspectArtifactReference
      parameters:
        - in: query
          name: path
          required: true
          schema: {type: string, maxLength: 2048}
      responses:
        '200': {description: Current full recorded reference and metadata. Administrators can inspect quarantine; other roles pass the current complete graph policy.}
        '400': {description: Use exactly one canonical path query parameter.}
        '403': {description: Current repository grant or content policy denied.}
        '404': {description: Reference absent from caller tenant/repository.}
  /api/v1/repositories/{repository}/policy:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    put:
      operationId: setRepositoryPolicy
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [require_review]
              properties:
                require_review: {type: boolean}
      responses:
        '200': {description: "Current policy updated; cached bytes use current policy on subsequent requests."}
        '403': {description: "Tenant admin required."}
        '404': {description: "Repository not found."}
        '409': {description: "Idempotency conflict."}
  /api/v1/repositories/{repository}/decisions:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    put:
      operationId: setManualDecision
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, digest, decision]
              properties:
                path: {type: string, maxLength: 2048}
                digest: {type: string, pattern: '^[a-f0-9]{64}$'}
                decision: {type: string, enum: [allowed, denied]}
      responses:
        '200': {description: "Manual decision versioned for this repository digest, covering existing and future aliases. The path is a checked selector. Response includes scope, decision_version and affected_references; no scanner verdict implied."}
        '403': {description: "Tenant admin required."}
        '404': {description: "Exact coordinate and digest not found."}
        '409': {description: "Idempotency conflict."}
  /api/v1/audit:
    get:
      operationId: listAuditEvents
      parameters:
        - in: query
          name: after
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200': {description: "Up to 1000 tenant events in sequence order; use last sequence as next cursor."}
        '400': {description: "Invalid sequence cursor."}

  /api/v1/repositories/{repository}/yanks:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    put:
      operationId: setPythonFileYank
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, yanked]
              additionalProperties: false
              properties:
                filename: {type: string, maxLength: 255}
                yanked: {type: boolean}
                reason: {type: string, maxLength: 4096}
      responses:
        '200': {description: "Versioned hosted Python file yank changed; idempotent replay retains the original revision. Yanked bytes remain readable under current policy."}
        '400': {description: "Invalid basename, reason or idempotency key."}
        '403': {description: "Tenant administrator required."}
        '404': {description: "Distribution absent from caller repository."}
        '409': {description: "Wrong format/mode or changed request under an existing key."}

  /api/v1/repositories/{repository}/grants:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    put:
      operationId: setRepositoryGrant
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor, read, write]
              additionalProperties: false
              properties:
                actor: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
                read: {type: boolean}
                write: {type: boolean, description: Also requires read plus a writer/admin token role.}
      responses:
        '200': {description: "Tenant actor grant changed; both booleans false revoke access."}
        '403': {description: "Tenant administrator required."}
        '409': {description: "Idempotency conflict."}
  /api/v1/repositories/{repository}/cache:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    get:
      operationId: inspectProxyRetrieval
      parameters:
        - in: query
          name: path
          required: true
          schema: {type: string, maxLength: 2048}
      responses:
        '200': {description: "State, generation, freshness/stale deadlines and last source result; credential and lease token values excluded."}
        '403': {description: "Current repository grant denied."}
        '404': {description: "Repository or retrieval absent from caller tenant."}
    put:
      operationId: expireProxyRetrieval
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties:
                path: {type: string, maxLength: 2048}
      responses:
        '200': {description: "Cached freshness expired and prior worker fenced; next authorized read performs retrieval."}
        '403': {description: "Tenant administrator required."}
        '404': {description: "No retrieval to expire."}
        '409': {description: "Idempotency conflict."}

  /api/v1/jobs:
    get:
      operationId: listJobs
      description: Tenant administrator inventory; refresh or read individual jobs to observe state changes. Worker-purpose tokens cannot use this API.
      parameters:
        - {in: query, name: queue, schema: {type: string, enum: [events, integrity, maintenance]}}
        - {in: query, name: state, schema: {type: string, enum: [pending, running, retry, succeeded, failed, cancel_requested, cancelled, uncertain]}}
        - {in: query, name: after, schema: {$ref: '#/components/schemas/JobId'}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200':
          description: Current inventory page; follow next until empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Job'}}
                  next: {type: string}
        '401': {description: "Missing, expired, revoked or worker-purpose credential."}
        '403': {description: Tenant administrator required.}
        '409': {description: Invalid filter or cursor.}
  /api/v1/jobs/queues:
    get:
      operationId: listQueueStatus
      description: Tenant administrator status. Capacity is operator configuration; outstanding and running are observed counters.
      responses:
        '200': {description: Three lane policies with current outstanding and live-running counts.}
        '403': {description: Tenant administrator required.}
  /api/v1/jobs/queues/{queue}:
    put:
      operationId: configureQueue
      description: Audited local recovery control remains available while outbox capacity is full. Reduced capacity preserves existing work.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {in: path, name: queue, required: true, schema: {type: string, enum: [events, integrity, maintenance]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueuePolicy'}
      responses:
        '200': {description: Persisted configuration; identical idempotency replay returns the original result.}
        '400': {description: "Invalid policy, body or mutation key."}
        '403': {description: Tenant administrator required.}
        '409': {description: Idempotency key reused with another request.}
  /api/v1/jobs/{job_id}:
    get:
      operationId: inspectJob
      parameters:
        - {in: path, name: job_id, required: true, schema: {$ref: '#/components/schemas/JobId'}}
      responses:
        '200':
          description: Current state of this tenant's effect.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '403': {description: Tenant administrator required.}
        '404': {description: No such job in this tenant.}
  /api/v1/jobs/{job_id}/{action}:
    post:
      operationId: controlJob
      description: Idempotent retry or cancellation. Running cancellation is a request until acknowledged or recovered after lease expiry. Retry preserves total attempts and starts a new cycle. Success cannot be retrospectively cancelled.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {in: path, name: job_id, required: true, schema: {$ref: '#/components/schemas/JobId'}}
        - {in: path, name: action, required: true, schema: {type: string, enum: [retry, cancel]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                acknowledge_unknown: {type: boolean, default: false, description: Required before redriving a future external uncertain outcome; these builtins do not create uncertain outcomes.}
      responses:
        '200': {description: Recorded control result; read job again for current progress.}
        '400': {description: Invalid body or mutation key.}
        '403': {description: Tenant administrator required.}
        '404': {description: No such job in this tenant.}
        '409': {description: State cannot accept this action or idempotency request conflicts.}
        '503': {description: Retry admission exceeds this lane's capacity; cancellation remains possible.}
  /api/v1/jobs/{job_id}/observations:
    get:
      operationId: listIntegrityObservations
      description: Immutable per-attempt storage-integrity observations. security_approval is false; observations cannot approve quarantine or bypass serving policy.
      parameters:
        - {in: path, name: job_id, required: true, schema: {$ref: '#/components/schemas/JobId'}}
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, description: Last observed generation.}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200': {description: "Items ordered by generation, more flag, assessment_kind storage_integrity and security_approval false."}
        '403': {description: Tenant administrator required.}
  /api/v1/activity:
    get:
      operationId: listProjectedActivity
      description: Asynchronous source-event index; authoritative full audit remains /api/v1/audit. Advance by completion position rather than source sequence so late completions are preserved.
      parameters:
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, description: "Last item's position, not its source sequence."}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200': {description: "Projection items with position, source sequence/hash, actor/kind and supplied coordinate fields; more flag."}
        '403': {description: Tenant administrator required.}

  /api/v1/maintenance/reconciliations:
    get:
      operationId: previewLeaseReconciliation
      description: Tenant administrator bounded sample of expired retrieval/upload leases at a database-clock cutoff. No reservation, effect or byte deletion; execution takes its own cutoff.
      parameters:
        - {in: query, name: repository, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200': {description: "Cutoff, retrievals and uploads samples with items/more, bytes_deleted zero."}
        '403': {description: Tenant administrator required.}
    post:
      operationId: requestLeaseReconciliation
      description: Admit durable maintenance work. Pages recheck current leases and atomically save effects/audit/cursor. Cancel preserves completed pages; retry resumes the same cutoff and cursor. Create a new request for a later cutoff. No physical deletion.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                repository: {type: string, description: Omit for the authenticated tenant.}
                page_size: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        '202': {description: Tenant-local job ID and initial progress. Inspect through the jobs API.}
        '400': {description: Invalid input or missing idempotency key.}
        '403': {description: Tenant administrator required.}
        '409': {description: Idempotency key reused with different input.}
        '503': {description: Maintenance admission capacity exhausted; repair worker or queue policy.}

  /api/v1/repositories/{repository}/retention-policies:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    get:
      operationId: listRetentionPolicies
      description: Administrator-only live name traversal of OCI retention policies. Inactive repositories retain administrative history.
      parameters:
        - {in: query, name: after, schema: {type: string, maxLength: 63}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200': {description: "Policy items and more; continue from the last policy name."}
        '400': {description: Invalid or repeated pagination fields.}
        '403': {description: Tenant administrator required.}
  /api/v1/repositories/{repository}/retention-policies/{name}:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
      - {in: path, name: name, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}
    get:
      operationId: inspectRetentionPolicy
      responses:
        '200': {description: Complete current configuration and exact revision.}
        '403': {description: Tenant administrator required.}
        '404': {description: No such policy in the authorized tenant repository.}
    put:
      operationId: configureRetentionPolicy
      description: Create at revision zero or replace the complete policy at its exact revision. Preview has no effects. Apply atomically retains configuration/history with journal/outbox and idempotency response. Replacing or disabling the policy stops further effects of earlier runs. OCI hosted and proxy repositories only; physical GC and automatic scheduling remain separate.
      parameters:
        - {in: header, name: Idempotency-Key, required: false, schema: {type: string, minLength: 8, maxLength: 128}, description: Required for apply; identical replays retain their original response.}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetentionPolicyRequest'}
      responses:
        '200': {description: Preview or committed configuration.}
        '400': {description: "Invalid or incomplete policy; duplicate, unknown and null required fields are rejected."}
        '403': {description: Tenant administrator required.}
        '409': {description: Stale revision or changed idempotency request.}
        '503': {description: "Database or queue unavailable; configuration/history and journal roll back together."}
  /api/v1/repositories/{repository}/retention-policies/{name}/history:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
      - {in: path, name: name, required: true, schema: {type: string}}
    get:
      operationId: listRetentionPolicyHistory
      parameters:
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200': {description: "Immutable configuration items and more; continue from the last revision."}
        '403': {description: Tenant administrator required.}
        '404': {description: No such policy.}
  /api/v1/repositories/{repository}/retention-policies/{name}/runs:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
      - {in: path, name: name, required: true, schema: {type: string}}
    get:
      operationId: listRetentionRuns
      parameters:
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200': {description: "Immutable plan summaries and job states with more; continue from the last job sequence prefix."}
        '403': {description: Tenant administrator required.}
        '404': {description: No such policy.}
    post:
      operationId: previewOrAdmitRetentionRun
      description: Preview the complete bounded live canonical manifest set and its exact tag/reference/lifecycle impact. Apply requires that preview digest and evaluation time within five minutes; admission recomputes it under the tenant lock. Limits are at most 10000 targets and 8 MiB of target metadata within the operator budget; no truncated plan is admitted. Immutable run/targets and a maintenance job commit with journal/outbox and idempotency. Workers recheck current policy/source and original requester authority plus each target's holds/references/tags/newest/content identity. Targets may be skipped but are never added. Bytes and decisions remain retained; reclaimed bytes is always zero.
      parameters:
        - {in: header, name: Idempotency-Key, required: false, schema: {type: string, minLength: 8, maxLength: 128}, description: Required for apply; successful identical replay survives expiration of the preview window.}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetentionRunRequest'}
      responses:
        '200': {description: "Preview with policy, fixed evaluation/expiry times, exact target set and digest."}
        '202': {description: "Durable job and immutable plan summary; bytes reclaimed is zero."}
        '400': {description: Invalid or incomplete preview/apply request.}
        '403': {description: Tenant administrator required.}
        '409': {description: Changed or expired preview or policy revision; obtain a new preview.}
        '413': {description: Complete plan exceeds the configured target or metadata budget.}
        '503': {description: "Queue or database unavailable; admission rolls back together."}
  /api/v1/repositories/{repository}/retention-policies/{name}/schedule:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
      - {in: path, name: name, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}
    get:
      operationId: inspectRetentionSchedule
      description: Read exact authorized policy and source revisions with due/retry status and last job. The enabled setting is approval configuration; recorded deferral and job outcomes describe actual admission and effects. Private credential hashes are never returned.
      responses:
        '200': {description: "Current approval configuration, due/retry times and last job state."}
        '403': {description: "Tenant administrator required."}
        '404': {description: "No such schedule in the authorized repository."}
    put:
      operationId: configureRetentionSchedule
      description: Explicitly approve future complete bounded target captures under exact policy/source revisions. Enabling requires authorize_future_retirements true. Preview has no effects. Apply records configuration/history with journal/outbox and idempotency. A database-clock due slot captures one immutable run; missed slots coalesce without a burst. Active runs or queue/budget pressure defer without consuming the slot. Revocation or changed policy/source blocks until reauthorized. Pausing or replacing the schedule stops unprocessed targets of its earlier runs; prior outcomes and retained bytes remain.
      parameters:
        - {in: header, name: Idempotency-Key, required: false, schema: {type: string, minLength: 8, maxLength: 128}, description: Required for apply; preserve the identical request for retries.}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetentionScheduleRequest'}
      responses:
        '200': {description: "Preview or committed replacement approval."}
        '201': {description: "Committed first schedule approval."}
        '400': {description: "Invalid or incomplete explicit authority; ambiguous and unknown fields are rejected."}
        '403': {description: "Tenant administrator required."}
        '404': {description: "No such authorized policy."}
        '409': {description: "Changed schedule/policy/source revision or idempotency request."}
        '503': {description: "Queue or database unavailable; configuration and journal roll back together."}
  /api/v1/repositories/{repository}/retention-policies/{name}/schedule/history:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
      - {in: path, name: name, required: true, schema: {type: string}}
    get:
      operationId: listRetentionScheduleHistory
      parameters:
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200': {description: "Immutable configuration items and more; continue from the last schedule revision."}
        '400': {description: "Invalid or repeated pagination parameters."}
        '403': {description: "Tenant administrator required."}
        '404': {description: "No such authorized schedule."}
  /api/v1/repositories/{repository}/retention-policies/{name}/schedule/runs:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
      - {in: path, name: name, required: true, schema: {type: string}}
    get:
      operationId: listScheduledRetentionRuns
      description: Read scheduled runs with immutable approval and due-slot provenance. Contradictory or missing receipts fail inspection; mutable job progress cannot replace authority. Inspect each run through the common retention detail/items endpoints.
      parameters:
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200': {description: "Immutable plan summaries and job states with more; continue from the last job sequence prefix."}
        '400': {description: "Invalid pagination or contradictory immutable schedule evidence."}
        '403': {description: "Tenant administrator required."}
        '404': {description: "No such authorized schedule."}
  /api/v1/maintenance/retention-runs/{job}:
    parameters:
      - {in: path, name: job, required: true, schema: {type: string}}
    get:
      operationId: inspectRetentionRun
      description: Immutable approved plan with counts derived from append-only outcomes. Mutable job payload is never execution authority. Cancellation and retry use the jobs API; completed targets do not repeat. A changed policy/source or requester credential requires a new approved run for remaining targets.
      responses:
        '200': {description: "Job, immutable plan and processed/retired/skipped counts; no private credential fence."}
        '403': {description: Tenant administrator required.}
        '404': {description: No such authorized job.}
  /api/v1/maintenance/retention-runs/{job}/items:
    parameters:
      - {in: path, name: job, required: true, schema: {type: string}}
    get:
      operationId: listRetentionTargetsAndOutcomes
      parameters:
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200': {description: "Immutable approved targets and committed outcomes with more; continue from the last target ordinal."}
        '400': {description: Invalid or repeated pagination parameters.}
        '403': {description: Tenant administrator required.}
        '404': {description: No such authorized job.}
  /api/v1/maintenance/integrity-schedules:
    get:
      operationId: listIntegritySchedules
      description: Administrator-only tenant-local recurring referenced-byte samples. Pagination is a live name traversal; an empty or clean sample is not a full-volume or security assessment. Authorizing credential hashes are never returned.
      parameters:
        - {in: query, name: after, schema: {type: string, maxLength: 63, description: Last returned schedule name.}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: "Schedule items, more flag and operator target budget."}
        '400': {description: Invalid or repeated pagination parameters.}
        '403': {description: Tenant administrator required.}
  /api/v1/maintenance/integrity-schedules/{name}:
    parameters:
      - {in: path, name: name, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}
    get:
      operationId: inspectIntegritySchedule
      description: Read current configuration and revision with durable sample cursor and admission status. Paused schedules retain existing jobs. A blocked schedule needs reauthorization with a current administrator credential.
      responses:
        '200': {description: "Current configuration, due/retry times and last job state; no private credential fence."}
        '403': {description: Tenant administrator required.}
        '404': {description: No such schedule in this tenant.}
    put:
      operationId: configureIntegritySchedule
      description: Create or replace complete settings at an exact revision. Reapplying settings also reauthorizes future admissions with the current credential. Preview has no effects. Apply atomically retains configuration/history with journal/outbox and idempotency response. Only repository scope changes reset rotation; existing jobs have separate controls. Late slots coalesce; queue pressure and an unresolved prior run defer admission without consuming a slot. Revocation or expiry blocks new admissions. Existing captured samples remain delegated read-only integrity work under the worker credential.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: Required for apply; 8–128 characters. An identical replay confirms the old response without reapplying settings or reauthorizing a later revision.
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrityScheduleRequest'}
      responses:
        '200': {description: Preview or updated configuration.}
        '201': {description: Newly created configuration.}
        '400': {description: "Invalid settings, body or idempotency key."}
        '403': {description: Tenant administrator required.}
        '409': {description: Stale schedule revision or changed idempotency request.}
        '503': {description: "Queue, schema or database unavailable; no partial configuration mutation."}
  /api/v1/maintenance/integrity-schedules/{name}/history:
    get:
      operationId: listIntegrityScheduleHistory
      description: Immutable public configuration receipts ordered by revision; credential hashes are omitted.
      parameters:
        - {in: path, name: name, required: true, schema: {type: string}}
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: "Configuration items and more; continue from the last revision."}
        '403': {description: Tenant administrator required.}
        '404': {description: No such schedule in this tenant.}
  /api/v1/maintenance/integrity-schedules/{name}/runs:
    get:
      operationId: listIntegrityScheduleRuns
      description: Durable due-slot and job identities with current assessment state. Mutable progress must match the immutable schedule/revision/due/coalescing receipt. Each sample captures bounded repository/digest/size bindings and immutable per-pass observations. A completed run may contain findings. Sample cleanliness never establishes all-tenant or security approval. Continue from the source sequence prefix of the last returned job ID.
      parameters:
        - {in: path, name: name, required: true, schema: {type: string}}
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: "Run items and more with sample coverage, coalesced intervals and false all-tenant/security verdicts."}
        '403': {description: Tenant administrator required.}
        '404': {description: No such schedule in this tenant.}
        '503': {description: Stored progress disagrees with immutable admission evidence; no current assessment is returned.}

  /api/v1/maintenance/integrity-sweeps:
    get:
      operationId: previewReferencedIntegritySweep
      description: Administrator bounded preview of current artifact and retained OCI upload-part bindings, including denied and unassessed content. No hash, reservation, policy approval or partial snapshot admission.
      parameters:
        - {in: query, name: repository, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200': {description: "Targets sample, more, operator target budget and security_approval false."}
        '403': {description: Tenant administrator required.}
    post:
      operationId: requestReferencedIntegritySweep
      description: Atomically snapshot every current repository/digest/size binding in scope with its job, audit and idempotency response. Unreferenced CAS and temporary files require separate inventory. The operator target budget and SQL deadline reject oversized admission without retaining a partial run.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                repository: {type: string, description: Omit for the authenticated tenant.}
      responses:
        '202': {description: "Job ID, immutable snapshot coverage and security_approval false."}
        '400': {description: Invalid body or missing idempotency key.}
        '403': {description: Tenant administrator required.}
        '409': {description: Idempotency key reused with different input.}
        '503': {description: "Snapshot or integrity queue budget exceeded, or database unavailable; no partial snapshot accepted."}
  /api/v1/maintenance/integrity-sweeps/{job_id}:
    get:
      operationId: inspectIntegritySweepCoverage
      description: Inspection completion and integrity health are separate. A succeeded inspection with findings is not clean. Current snapshot counts and pass remain visible; security_approval is always false. Control through the jobs API; completed retry starts a new pass over the same snapshot, interrupted retry resumes its cursor.
      parameters:
        - {in: path, name: job_id, required: true, schema: {$ref: '#/components/schemas/JobId'}}
      responses:
        '200': {description: "Job plus all_targets_assessed, integrity_clean, security_approval and exact scope."}
        '403': {description: Tenant administrator required.}
        '404': {description: No such sweep in the authenticated tenant.}
        '503': {description: Scheduled progress disagrees with its immutable admission receipt; investigate retained evidence.}
  /api/v1/maintenance/integrity-sweeps/{job_id}/items:
    get:
      operationId: listIntegritySweepTargets
      description: Immutable target bindings with alias/part counts and the current pass's latest per-target storage observation. Full history is the job observations API with ordinal and pass fields. No policy grant follows from a verified hash.
      parameters:
        - {in: path, name: job_id, required: true, schema: {$ref: '#/components/schemas/JobId'}}
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0, description: Last returned ordinal.}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200': {description: "Items ordered by ordinal, more, security_approval false. Status is pending or a concrete storage finding; reference_conflict remains separately visible."}
        '403': {description: Tenant administrator required.}
        '404': {description: No such sweep in the authenticated tenant.}
        '503': {description: Scheduled progress disagrees with its immutable admission receipt; no target page is returned.}

  /api/v1/maintenance/storage-inventories:
    get:
      operationId: listStorageInventories
      description: Administrator tenant-scoped inventory jobs. Refresh individual jobs for progress.
      parameters:
        - {in: query, name: after, schema: {$ref: '#/components/schemas/JobId'}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {in: query, name: state, schema: {type: string}}
      responses:
        '200': {description: Job items and next cursor.}
        '403': {description: Tenant administrator required.}
    post:
      operationId: requestStorageInventory
      description: Admit a bounded live tenant filesystem walk plus an immutable artifact/upload-part reference snapshot. No physical deletion or security approval. Replays return the original response even if storage later changes. A new request performs a new walk.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                page_size: {type: integer, minimum: 1, maximum: 1000, default: 100, description: Must fit the operator directory budget.}
      responses:
        '202': {description: "Durable job ID, root fingerprint, immutable reference snapshot and resource budgets; safe_to_delete/security_approval false."}
        '400': {description: "Invalid body, page budget or missing idempotency key."}
        '403': {description: Tenant administrator required.}
        '409': {description: Idempotency conflict.}
        '503': {description: "Unsupported/unavailable storage, oversized reference snapshot or exhausted integrity admission capacity; no partial admission."}
  /api/v1/maintenance/storage-inventories/{job_id}:
    get:
      operationId: inspectStorageInventory
      description: Live walk consistency and per-pass findings remain explicit. Enumeration, supported layout, CAS checks and reference checks have separate completion/health fields. Temporary/legacy bytes remain unverified. No deletion authorization or policy approval. Cancel/retry through jobs API; interrupted retry resumes, completed retry rechecks retained observations in another pass.
      parameters:
        - {in: path, name: job_id, required: true, schema: {$ref: '#/components/schemas/JobId'}}
      responses:
        '200': {description: "Job/progress, coverage and integrity fields, unverified temporary/legacy count, safe_to_delete false and security_approval false."}
        '403': {description: Tenant administrator required.}
        '404': {description: No such inventory in this tenant.}
  /api/v1/maintenance/storage-inventories/{job_id}/items:
    get:
      operationId: listStorageInventoryEntries
      description: Immutable observed entries with exact name_b64, type, size/identity/time, current-pass hash and observed versus current reference counts. Current references can change; an unreferenced observation never permits deletion. Logical bytes are pathname sizes, not allocated disk usage.
      parameters:
        - {in: path, name: job_id, required: true, schema: {$ref: '#/components/schemas/JobId'}}
        - {in: query, name: area, schema: {type: string, enum: [root, sha256, cas, staged, uploads]}}
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200': {description: "Entries ordered by ordinal, more and safe_to_delete/security_approval false."}
        '403': {description: Tenant administrator required.}
        '404': {description: No such inventory in this tenant.}
  /api/v1/maintenance/storage-inventories/{job_id}/references:
    get:
      operationId: listInventoryReferenceSnapshot
      parameters:
        - {in: path, name: job_id, required: true, schema: {$ref: '#/components/schemas/JobId'}}
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0, description: Last target ordinal.}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200': {description: "Original immutable reference targets, current-pass receipts and more. Full reference history is the jobs observations endpoint."}
        '403': {description: Tenant administrator required.}
        '404': {description: No such inventory in this tenant.}
  /api/v1/maintenance/storage-inventories/{job_id}/observations:
    get:
      operationId: listInventoryCASObservations
      description: Immutable per-pass CAS hash history; joins the original observed entry binding. No policy approval.
      parameters:
        - {in: path, name: job_id, required: true, schema: {$ref: '#/components/schemas/JobId'}}
        - {in: query, name: after, schema: {type: integer, format: int64, minimum: 0, default: 0, description: Last observed generation.}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200': {description: Receipts ordered by generation with ordinal/pass/digest/size/status/worker/engine/time and more.}
        '403': {description: Tenant administrator required.}
        '404': {description: No such inventory in this tenant.}
  /api/v1/repositories/{repository}/artifacts/repairs:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    post:
      summary: Preview or create an exact-byte repair as a tenant administrator
      description: Uses an existing retained path/digest/size as truth. Apply records a durable integrity job waiting for its source. Workers cannot claim it until source acceptance. Current policy, holds, tombstones and source epochs remain unchanged. Shared tenant-local references may benefit. The JSON limit is 8 KiB; duplicate or noncanonical field names are rejected.
      parameters:
        - in: header
          name: Idempotency-Key
          description: Required unless dry_run is true. Reuse only with the identical plan.
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path, digest, expected_source_revision, reason, provenance]
              properties:
                path: {type: string, minLength: 1, maxLength: 2048}
                digest: {type: string, pattern: '^[a-f0-9]{64}$'}
                expected_source_revision: {type: integer, format: int64, minimum: 0}
                reason: {type: string, minLength: 1, maxLength: 1024, description: At most 1024 UTF-8 bytes without controls.}
                provenance: {type: string, minLength: 1, maxLength: 1024, description: "Source of the independently retained recovery copy; an operator statement, not a scanner approval."}
                dry_run: {type: boolean, default: false}
      responses:
        '200': {description: 'Preview target, source_revision, affected_references, actor/reason/provenance and security_approval=false; no operation created.'}
        '202': {description: 'Durable job, plan and state=awaiting_source; no bytes have been replaced.'}
        '400': {description: Invalid or ambiguous repair JSON}
        '403': {description: Tenant administrator required}
        '404': {description: No authorized retained reference}
        '409': {description: "Reference/source revision changed, conflicting retained sizes or reused key with different plan"}
        '413': {description: Repair JSON exceeds 8 KiB}
        '503': {description: "Queue, bound, schema, storage or database unavailable; no partial operation"}
  /api/v1/maintenance/repairs/{job}/source:
    parameters:
      - in: path
        name: job
        required: true
        schema: {$ref: '#/components/schemas/JobId'}
    put:
      summary: Stream the exact source for an existing waiting repair
      description: The original requesting administrator supplies application/octet-stream bytes. Full digest and size must match the plan. Synced staging precedes atomic acceptance and job readiness. Apply-time authority, source/reference identity, cancellation and generation are rechecked by the worker. A replay confirms its previously accepted source without reading a new body. Completion requires a succeeded job and immutable verified observation; cancellation never undoes bytes already installed.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '202': {description: 'Source accepted, source_ready=true and state=queued. Installation and readback are still pending.'}
        '400': {description: Declared length or actual digest/length mismatch}
        '403': {description: Original requesting tenant administrator required}
        '404': {description: No repair in this tenant}
        '409': {description: "Source already accepted under another key, operation stopped or reference/source changed"}
        '413': {description: Source exceeds the configured object limit}
        '415': {description: Use application/octet-stream}
        '503': {description: "Bounded upload lane, storage identity/layout, schema or database unavailable"}
  /api/v1/repositories/{repository}/configuration:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    get:
      summary: Read retained source settings as a tenant administrator
      responses:
        '200': {description: 'Repository settings and read-only source_revision, including suspended/removed repositories. Credential references contain no secret values.'}
        '403': {description: Administrator required}
        '404': {description: No authorized retained repository}
    put:
      summary: Preview or replace complete proxy/group source settings
      description: Every apply increments source_revision, including identical settings and historical rollback. Old source caches, validators and download locators require revalidation. Pending writers are fenced atomically with immutable history, journal, outbox and idempotency receipt. Preview checks local credential/destination bindings without contacting the upstream. A replay returns its original response without changing current settings. The request body is limited to 64 KiB.
      parameters:
        - in: header
          name: Idempotency-Key
          description: Required unless dry_run is true. Retry only identical request bytes.
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, settings, reason]
              properties:
                expected_revision: {type: integer, format: int64, minimum: 0}
                settings: {type: object, description: Complete source settings in the repository creation settings format; omitted fields are removed.}
                reason: {type: string, minLength: 1, maxLength: 1024, description: Nonempty bounded UTF-8 reason without controls; byte limit is 1024.}
                dry_run: {type: boolean, default: false}
      responses:
        '200': {description: 'Current repository, validated settings, next_revision, active_retrievals, referencing groups, member_states, refresh_required and retained_bytes. Apply returns the committed current revision.'}
        '400': {description: Invalid settings/reason/revision/key or upstream_credential_authority mismatch}
        '403': {description: Administrator required}
        '404': {description: No authorized retained repository}
        '409': {description: configuration_changed revision conflict or reused key with different bytes}
        '413': {description: Configuration JSON exceeds 64 KiB}
        '503': {description: "Bound, queue, schema or database failure; no partial configuration mutation"}
  /api/v1/repositories/{repository}/configuration/history:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    get:
      summary: Read immutable tenant-scoped source configuration receipts
      parameters:
        - in: query
          name: after
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 1000, default: 10}
      responses:
        '200': {description: 'Ascending items with revision, previous_revision, previous_settings, settings, actor, reason, changed_at and change_sequence; after is the last returned revision.'}
        '400': {description: "Invalid, repeated or unknown query parameters"}
        '403': {description: Administrator required}
        '404': {description: No authorized retained repository}
        '503': {description: "Response budget, schema or database unavailable"}
  /api/v1/repositories/{repository}/state:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    get:
      summary: Inspect retained repository lifecycle as a tenant administrator
      description: Authorizes the retained record, including suspended and removed repositories. An untouched repository is active with revision 0.
      responses:
        '200': {description: 'Repository, state (active/suspended/removed), revision, reason, actor, changed_at and change_sequence.'}
        '403': {description: Administrator required}
        '404': {description: No authorized retained repository}
        '503': {description: Schema or database unavailable}
    put:
      summary: Preview or apply a retained repository transition
      description: Suspension/removal atomically fences bounded active retrievals and uploads with journal, outbox and idempotency response. Bytes and references remain. Resume/restore cannot revive fenced writers. Inactive members fail group reads without fallback. Source URL/configuration changes are a separate operation.
      parameters:
        - in: header
          name: Idempotency-Key
          description: Required unless dry_run is true. Reuse only with identical request bytes.
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, expected_revision]
              properties:
                action: {type: string, enum: [suspend, resume, remove, restore]}
                expected_revision: {type: integer, minimum: 0}
                reason: {type: string, maxLength: 1024, description: At most 1024 UTF-8 bytes without controls}
                dry_run: {type: boolean, default: false}
      responses:
        '200': {description: 'Current lifecycle and desired state, active transfer counts and referencing groups. A preview has no durable effects; a mutation returns its committed revision.'}
        '400': {description: Invalid JSON or missing explicit revision/key}
        '403': {description: Administrator required}
        '404': {description: Repository not found}
        '409': {description: Stale revision or invalid transition; removed requires restore}
        '503': {description: "Budget, durable queue, schema or database failure; no partial transition"}
  /api/v1/repositories/{repository}/artifacts/lifecycle:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    get:
      summary: Inspect retained OCI reference lifecycle as an authorized writer
      description: Current tenant administrators can inspect references in suspended or removed repositories. Other writers retain the active-repository requirement. Inspection grants no native serving or destructive-operation bypass.
      parameters:
        - in: query
          name: path
          required: true
          schema: {type: string, maxLength: 2048}
          description: Canonical image/manifests/sha256:HEX or image/blobs/sha256:HEX path, never a tag alias
      responses:
        '200': {description: 'Repository, path, digest, deleted, held, revision, hold reason/expiry, actor and journal change sequence. Untouched revision is 0.'}
        '403': {description: Current write role and grant required}
        '404': {description: Reference or authorized repository not found}
        '503': {description: Repository suspended or dependency unavailable}
    put:
      summary: Preview or apply retained OCI deletion, restore or administrator hold
      description: Strong active manifest references block child deletion. Holds protect deletion/restore and native tag deletion. Current administrators may place or release a hold in a suspended or removed repository; deletion and restore retain the active-repository requirement. Restore verifies all retained CAS bytes and reparses manifests outside SQL, then rechecks exact graph identities and revision under the tenant write lock. It preserves security decisions and newer tag bindings. There is no physical byte reclamation. Proxy tombstones require explicit restore; refresh and group fallback cannot resurrect them. Native hosted digest/tag DELETE returns 202; native proxy/group writes remain read-only.
      parameters:
        - in: header
          name: Idempotency-Key
          description: Required unless dry_run is true. Current role/grant is required even for replay.
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path, digest, action, expected_revision]
              properties:
                path: {type: string, maxLength: 2048}
                digest: {type: string, pattern: '^[a-f0-9]{64}$'}
                action: {type: string, enum: [delete, restore, hold, release_hold]}
                expected_revision: {type: integer, minimum: 0}
                reason: {type: string, maxLength: 1024, description: At most 1024 UTF-8 bytes without controls; a nonempty reason is required for hold}
                hold_until: {type: string, format: date-time, description: Optional future expiry for hold; omit for indefinite hold}
                dry_run: {type: boolean, default: false}
      responses:
        '200': {description: 'Current lifecycle, action, bounded strong parents, tag aliases, weak subject dependents, active retrieval count and retained_bytes=true. Dry-run reports blockers without changing state.'}
        '400': {description: Invalid JSON or missing explicit revision/key}
        '403': {description: Current writer/grant required; holds require administrator}
        '404': {description: Canonical reference or required active repository not found}
        '409': {description: "Active hold, incoming reference, stale identity/revision or changed graph"}
        '503': {description: "Missing/corrupt bytes, metadata budget, durable queue, schema or dependency failure; no partial transition"}
  /api/v1/holds:
    get:
      summary: Discover current tenant hold observations as an administrator
      description: Lists active, expired or released per-reference OCI holds across the tenant, including suspended and removed repositories. Released records require an actual earlier hold/release receipt; unrelated native deletions are excluded. Status is computed at observed_at. Pages are live; expiry and concurrent changes can alter later pages. No bytes are erased or serving authority granted.
      parameters:
        - in: query
          name: state
          schema: {type: string, enum: [active, expired, released, all], default: active}
        - in: query
          name: repository
          schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
          description: Optional exact repository filter
        - in: query
          name: q
          schema: {type: string, maxLength: 256}
          description: Literal Unicode simple-fold search across repository/path/digest and reasons; at most 256 UTF-8 bytes without controls
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 3000}
          description: Returned encrypted continuation bound to tenant/actor/role/credential/endpoint and filters; it grants no authority
      responses:
        '200':
          description: Bounded live hold page with current authority and one observation time
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, next, previous, scope, observed_at]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/HoldRecord'}}
                  limit: {type: integer}
                  next: {type: string}
                  previous: {type: string}
                  scope: {type: string}
                  observed_at: {type: string, format: date-time}
        '400': {description: "Invalid, repeated or unknown filters; malformed or differently scoped cursor"}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator authority required}
        '405': {description: Read this endpoint with GET}
        '503': {description: "Page byte budget, schema or database dependency failure; no partial record returned"}
  /api/v1/repositories/{repository}/artifacts/lifecycle/history:
    parameters:
      - {$ref: '#/components/parameters/Repository'}
    get:
      summary: Read original immutable hold and release journal snapshots
      description: Current tenant administrator access is required on every page, including retained repositories. Reads actual earlier transactional receipts without inventing a baseline or expiry event. The held flag and hold_until describe the original snapshot. Event hashes identify full journal events; this filtered view is not a complete audit-chain export.
      parameters:
        - in: query
          name: path
          required: true
          schema: {type: string, maxLength: 2048}
          description: Canonical OCI manifest or blob digest path
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 3000}
          description: Returned encrypted continuation bound to current credential and this exact repository/path endpoint
      responses:
        '200':
          description: Bounded original hold/release receipts with encrypted forward/reverse continuations
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, next, previous, scope]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/HoldChange'}}
                  limit: {type: integer}
                  next: {type: string}
                  previous: {type: string}
                  scope: {type: string}
        '400': {description: "Invalid, repeated or unknown parameters; malformed or differently scoped cursor"}
        '401': {description: Expired or revoked credential}
        '403': {description: Current tenant administrator authority required}
        '404': {description: No authorized retained repository or canonical reference}
        '405': {description: Read this endpoint with GET}
        '409': {description: Unsupported reference or inconsistent durable snapshot}
        '503': {description: "Response byte budget, schema or database dependency failure; no partial record returned"}
